name: CI Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Pinned to the deploy target (serverless.yml runtime: nodejs20.x)
          # rather than `lts/*`, which drifts onto a newer major than the one
          # production actually runs.
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      # No `continue-on-error` below: both of these pass today, so leaving them
      # advisory only meant a future regression would land unnoticed.
      - name: Lint Markdown
        run: npm run lint:md

      - name: Check for code duplication (jscpd)
        run: npm run lint:cpd:ci

      - name: Upload duplication report
        uses: actions/upload-artifact@v6
        with:
          name: jscpd-report
          path: reports/jscpd/
          retention-days: 30
        if: always()

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20.x is the deploy target (AWS Lambda nodejs20.x); 22.x is the next
        # LTS, kept as an early warning for the eventual runtime bump.
        #
        # Node 18 was removed: package.json declares `engines.node >= 20.5.0`
        # and .npmrc sets `engine-strict=true`, so `npm ci` cannot succeed on
        # 18 — that matrix leg could only ever fail.
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          CI: true

      - name: Run test coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false
