name: PR Check

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Validate GitHub Actions Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Structural validation only. Lint, tests, build and the security gates
      # live in ci.yml and security.yml; this job used to re-run them with
      # `continue-on-error: true` on every step, which meant it reported success
      # no matter what happened and duplicated the Actions minutes of the real
      # jobs. That job has been removed rather than re-armed.
      - name: Validate workflow syntax
        run: |
          python3 - <<'PY'
          import glob
          import sys

          import yaml

          errors = []
          files = sorted(glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml'))

          if not files:
              print('No workflow files found.')
              sys.exit(0)

          for path in files:
              print(f'Checking {path}...')
              try:
                  with open(path, encoding='utf-8') as handle:
                      doc = yaml.safe_load(handle)
              except yaml.YAMLError as exc:
                  errors.append(f'{path}: invalid YAML: {exc}')
                  continue

              if not isinstance(doc, dict):
                  errors.append(f'{path}: top level is not a mapping')
                  continue

              # YAML 1.1 resolves a bare `on:` key to the boolean True, so the
              # trigger block can appear under either key depending on quoting.
              if 'on' not in doc and True not in doc:
                  errors.append(f'{path}: missing "on" trigger')

              if 'jobs' not in doc:
                  errors.append(f'{path}: missing "jobs" section')

          if errors:
              print()
              for error in errors:
                  print(f'ERROR: {error}')
              print(f'\nFound {len(errors)} workflow problem(s)')
              sys.exit(1)

          print('\nAll workflow files are valid')
          PY
