name: Release

on:
  push:
    tags:
      - 'v*'

# Required to create the GitHub release. Without this the job inherits the
# repository default, which is read-only in this org, and the release step
# fails with a 403 only at tag time.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          # Matches the deploy target (serverless.yml runtime: nodejs20.x).
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run test coverage
        run: npm run test:coverage

      # `actions/create-release` was archived by GitHub in 2021 and receives no
      # security updates; `gh release create` ships on the runner and needs no
      # third-party action in the release path.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Release ${GITHUB_REF_NAME}" \
            --generate-notes
